port: 7880
rtc:
  tcp_port: 7881
  # One UDP port per participant (screen-audio aux participants count too).
  # 101 ports was tight for a busy room; keep the firewall rule in sync
  # (docs/deploy.md §5).
  port_range_start: 50000
  port_range_end: 50500
  use_external_ip: false
  node_ip: 45.205.28.177
  stun_servers:
    - 45.205.28.177:3478
  congestion_control:
    enabled: true
    allow_pause: true
    # Screen-share viewers used to start on the lowest simulcast layer and
    # climb only as the downlink estimate grew from a cold start. Assume at
    # least this much capacity so a fresh subscriber is put straight on the
    # full layer; real congestion still steps it down. Ignored by
    # livekit-server builds predating the option (non-strict config).
    min_channel_capacity: 4000000
audio:
  # Keep active-speaker highlighting responsive without changing the noise
  # threshold. LiveKit defaults to 500 ms updates smoothed over 4 intervals;
  # this reduces the visible transition to roughly half a second.
  update_interval: 250
  smooth_intervals: 2
keys:
  ikun: yingmianzoulaidenirangworucichunchunyudong
webhook:
  api_key: ikun
  urls:
    - http://127.0.0.1:21116/webhooks/livekit
